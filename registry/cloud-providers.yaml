schema_version: solo-empire.cloud-providers.v1
version: 1
purpose: Read-only source of truth for cloud and SaaS providers used or evaluated by Solo Empire.
read_only_by_default: true
deployment_enabled: false
write_actions_enabled: false
write_entrypoint: paas:action:propose
write_actions_reason: Provider mutations are not enabled directly; any future write must go through the reviewed PaaS proposal workflow.

providers:
  - id: cloudflare
    name: Cloudflare
    icon: "☁"
    category: edge-storage
    dashboard_url: https://dash.cloudflare.com
    api_docs: https://developers.cloudflare.com/api/
    cli_binary: wrangler
    cli_version_command: [wrangler, --version]
    cli_install:
      command: npm install --global wrangler
      url: https://developers.cloudflare.com/workers/wrangler/install-and-update/
    auth:
      env: [CLOUDFLARE_API_TOKEN]
      secret_manager:
        path: /cloudflare
        names: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID]
      cli_session:
        check_command: [wrangler, whoami]
        token_command: null
    optional_env: [CLOUDFLARE_ACCOUNT_ID]
    capabilities:
      health: true
      inventory: true
      usage: true
      billing: false
    adapter_status: partial
    write_policy: proposal_only
    paas: false
    project_usage:
      - project: solo-empire
        uses: [r2-data-lake-storage]
        status: integrated
        evidence:
          - infra/scripts/platform/cloudflare_r2_usage.py
          - systems/cloud-platform/cloud-generalist-stack.md
      - project: solo-empire
        uses: [workers, pages]
        status: documented
        evidence:
          - docs/ARCHITECTURE.md
          - systems/cloud-platform/cloud-generalist-stack.md
        note: Runtime use is documented, but a live deployment was not verified by this registry change.

  - id: github
    name: GitHub
    icon: "🐙"
    category: source-control-ci
    dashboard_url: https://github.com/settings/billing
    api_docs: https://docs.github.com/rest
    cli_binary: gh
    cli_version_command: [gh, --version]
    cli_install:
      url: https://cli.github.com/
    auth:
      env: [GITHUB_PERSONAL_ACCESS_TOKEN, GITHUB_TOKEN]
      secret_manager:
        path: /github
        names: [GITHUB_PERSONAL_ACCESS_TOKEN, GITHUB_TOKEN]
      cli_session:
        check_command: [gh, auth, status]
        token_command: [gh, auth, token]
    optional_env: [GITHUB_BILLING_OWNER, GITHUB_BILLING_OWNER_TYPE, GITHUB_ACTIONS_PLAN]
    capabilities:
      health: true
      inventory: false
      usage: true
      billing: true
    adapter_status: partial
    write_policy: proposal_only
    paas: false
    project_usage:
      - project: solo-empire
        uses: [source-control, ci-cd, actions-billing]
        status: integrated
        evidence:
          - infra/scripts/platform/github_actions_usage.py
          - infra/platform/README.md

