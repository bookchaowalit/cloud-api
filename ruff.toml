# Ruff defaults, adjusted for this repository (DevSecOps Phase 1). The adapters were split out of
# solo-empire and put their siblings on sys.path before importing.
[lint]
# - I001: import order is load-bearing (sys.path setup before the late imports), so imports are
#   not re-sorted.
# - RUF100: the existing `# noqa: E402 (...)` comments explain each late import; keep them.
# Lint debt that needs a behaviour review before it can be fixed (re-enable one by one):
# - BLE001: ~46 deliberate broad excepts that map any provider/IO failure to a safe error envelope.
# - TRY004: ValueError -> TypeError would change the exception type callers and tests rely on.
# - S110: one best-effort metadata lookup that swallows errors on purpose.
extend-ignore = ["I001", "RUF100", "BLE001", "TRY004", "S110"]
